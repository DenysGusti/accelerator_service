apiVersion: v1
kind: Pod
metadata:
  name: accelerator-k8sworker
spec:
  containers:
  - name: accelerator-k8sworker
    image: registry.iiasa.ac.at/accelerator/iiasa-acc-k8sworker:2df2034c
    envFrom:
      - secretRef:
          name: accelerator-be-secret
    imagePullPolicy: Always
    resources:
      limits:
        memory: "2000Mi"
        cpu: "2000m"
      requests:
        memory: "2000Mi"
        cpu: "2000m"

  imagePullSecrets:
    - name: iiasaregcred
