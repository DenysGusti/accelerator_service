apiVersion: v1
kind: Pod
metadata:
  name: accelerator-k8sworker
spec:
  containers:
  - name: accelerator-k8sworker
    image: registry.iiasa.ac.at/accelerator/iiasa-acc-k8sworker:eab3ac06
    envFrom:
      - secretRef:
          name: accelerator-be-secret
    imagePullPolicy: Always
    resources:
      limits:
        memory: "2000Mi"
        cpu: "2000m"
      requests:
        memory: "2000Mi"
        cpu: "2000m"
    volumeMounts:
      - name: cluster-ca-certs
        mountPath: /usr/local/share/ca-certificates
        readOnly: true
  volumes:
    - name: cluster-ca-certs
      configMap:
        name: cluster-ca-certs
        optional: true

  imagePullSecrets:
    - name: iiasaregcred
