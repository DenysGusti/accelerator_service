apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: hf.csi.accelerator
spec:
  attachRequired: false
  podInfoOnMount: true
  requiresRepublish: true
  volumeLifecycleModes:
    - Ephemeral
    - Persistent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hf-csi-node
  namespace: kube-system
  labels:
    app: hf-csi-driver
spec:
  selector:
    matchLabels:
      app: hf-csi-node
  template:
    metadata:
      labels:
        app: hf-csi-node
    spec:
      hostPID: true
      serviceAccountName: hf-csi-driver
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: hf-csi-plugin
          image: ghcr.io/wrufesh/hf-csi-driver:v0.9.2-acc-p11
          imagePullPolicy: IfNotPresent
          args:
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(CSI_NODE_NAME)
            - --cache-dir=/var/lib/hf-csi-driver/cache
            - --mount-image=ghcr.io/wrufesh/hf-mount-fuse:v0.6.5-acc-pr140-p14
            - --mount-pull-policy=IfNotPresent
            - --fuse-sweep-enabled=true
            - --fuse-sweep-interval=60s
            - --v=4
          env:
            - name: CSI_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ACCELERATOR_MOUNT
              value: "1"
            - name: ACC_ENDPOINT
              value: "https://host.docker.internal:8000"
            - name: ACC_CAS_ENDPOINT
              value: "https://host.docker.internal:8000/api/xet-cas"
          securityContext:
            privileged: true
          volumeMounts:
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: plugin-dir
              mountPath: /csi
            - name: cache-dir
              mountPath: /var/lib/hf-csi-driver/cache
            - name: mnt-dir
              mountPath: /var/lib/hf-csi-driver/mnt
              mountPropagation: Bidirectional
          ports:
            - name: healthz
              containerPort: 9808
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10

        - name: node-driver-registrar
          image: public.ecr.aws/eks-distro/kubernetes-csi/node-driver-registrar:v2.13.0-eks-1-31-12
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/hf.csi.accelerator/csi.sock
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration

        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.14.0
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9808
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi

      volumes:
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/hf.csi.accelerator/
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
        - name: cache-dir
          hostPath:
            path: /var/lib/hf-csi-driver/cache
            type: DirectoryOrCreate
        - name: mnt-dir
          hostPath:
            path: /var/lib/hf-csi-driver/mnt
            type: DirectoryOrCreate
