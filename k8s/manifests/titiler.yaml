apiVersion: apps/v1
kind: Deployment
metadata:
  name: titiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: titiler
  template:
    metadata:
      labels:
        app: titiler
      annotations:
        kubernetes.io/restart-at: "2025-01-15T15:30:00+0200"
    spec:
      containers:
      - name: titiler
        image: registry.iiasa.ac.at/accelerator/titiler:233a46e
        envFrom:
          - secretRef:
              name: titiler-secret
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "2048Mi"
            cpu: "2000m"
          requests:
            memory: "2048Mi"
            cpu: "2000m"
        volumeMounts:
          - name: cluster-ca-certs
            mountPath: /usr/local/share/ca-certificates
            readOnly: true
      volumes:
        - name: cluster-ca-certs
          configMap:
            name: cluster-ca-certs
            optional: true
      imagePullSecrets:
        - name: iiasaregcred
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: titiler-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: titiler
  minReplicas: 5
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: titiler-service
spec:
  type: NodePort
  selector:
    app: titiler
  ports:
    - protocol: TCP
      port: 8798
      targetPort: 8000
      nodePort: 30135

