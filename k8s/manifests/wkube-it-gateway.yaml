apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wkube-it-gateway-acme
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wkube-it-gateway
spec:
  replicas: 1
  # The ACME volume is ReadWriteOnce: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wkube-it-gateway
  template:
    metadata:
      labels:
        app: wkube-it-gateway
    spec:

      securityContext:
        fsGroup: 65534

      volumes:
        - name: tls-certs
          secret:
            secretName: at.ac.iiasa.wkube
        - name: tunnel-keys
          secret:
            secretName: wkube-tunnel-gateway-keys
            defaultMode: 0400
        - name: acme
          persistentVolumeClaim:
            claimName: wkube-it-gateway-acme

      containers:
        - name: wkube-it-gateway
          image: registry.iiasa.ac.at/accelerator/wkube-it-gateway:d2d1711
          imagePullPolicy: Always
          envFrom:
          - secretRef:
              name: wkube-it-gateway
          env:
            # Let's Encrypt certificates for custom domains (autocert). Must be persistent.
            - name: ACME_CACHE_DIR
              value: /var/lib/wkube-acme
            - name: TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/16
          volumeMounts:
            - name: tls-certs
              mountPath: "/etc/ssl/certs"
              readOnly: true
            - name: tunnel-keys
              mountPath: "/etc/wkube-tunnel"
              readOnly: true
            - name: acme
              mountPath: "/var/lib/wkube-acme"

          ports:
          - containerPort: 6473
          - containerPort: 2222
          resources:
            limits:
              memory: "2048Mi"
              cpu: "2000m"
            requests:
              memory: "2048Mi"
              cpu: "2000m"

      imagePullSecrets:
        - name: iiasaregcred
---
apiVersion: v1
kind: Service
metadata:
  name: wkube-it-gateway-service
spec:
  type: NodePort
  selector:
    app: wkube-it-gateway
  ports:
    - protocol: TCP
      port: 8913
      targetPort: 6473
      nodePort: 30153
---
apiVersion: v1
kind: Service
metadata:
  name: wkube-it-gateway-sshd-service
spec:
  type: NodePort
  selector:
    app: wkube-it-gateway
  ports:
    - protocol: TCP
      port: 8914
      targetPort: 2222
      nodePort: 31188
