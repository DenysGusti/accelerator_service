# ==========================================
# 0. WORKLOAD NAMESPACE
# ==========================================
apiVersion: v1
kind: Namespace
metadata:
  name: wkube
---
# ==========================================
# 1. REGISTRY BRIDGE (ExternalName to host gateway)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: wkube
spec:
  type: ExternalName
  externalName: host.docker.internal
---
# ==========================================
# 2. MINIO BRIDGE (ExternalName to host gateway)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: wkube
spec:
  type: ExternalName
  externalName: host.docker.internal
---
# ==========================================
# 3. BACKEND BRIDGE (ExternalName to host gateway)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: web-be
  namespace: wkube
spec:
  type: ExternalName
  externalName: host.docker.internal
---
# ==========================================
# 4. STORAGE CLASSES
# ==========================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-rwx
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
# ==========================================
# 5. REGISTRY TLS TRUST & NODE CA CONFIGURATOR
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: containerd-registry-trust
  namespace: kube-system
  labels:
    app: containerd-registry-trust
spec:
  selector:
    matchLabels:
      app: containerd-registry-trust
  template:
    metadata:
      labels:
        app: containerd-registry-trust
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: configurator
          image: alpine:latest
          securityContext:
            privileged: true
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              mkdir -p /host-etc/containerd/certs.d/registry:8443
              cat << 'EOF' > /host-etc/containerd/certs.d/registry:8443/hosts.toml
              server = "https://registry:8443"

              [host."https://host.docker.internal:8443"]
                capabilities = ["pull", "resolve"]
                ca = ["/etc/containerd/certs.d/registry:8443/ca.crt"]
              EOF

              if [ -d /cluster-ca-certs ]; then
                cp -f /cluster-ca-certs/accelerator-dev-ca.crt /host-etc/containerd/certs.d/registry:8443/ca.crt 2>/dev/null || true
                mkdir -p /host-root/usr/local/share/ca-certificates
                cp -f /cluster-ca-certs/*.crt /host-root/usr/local/share/ca-certificates/ 2>/dev/null || true
                chroot /host-root /usr/sbin/update-ca-certificates || true
                echo "Registry containerd trust and cluster root CA certificates installed on node successfully"
              fi

              sleep infinity
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
            - name: host-root
              mountPath: /host-root
            - name: cluster-ca-certs-vol
              mountPath: /cluster-ca-certs
              readOnly: true
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-root
          hostPath:
            path: /
        - name: cluster-ca-certs-vol
          configMap:
            name: cluster-ca-certs
            optional: true
