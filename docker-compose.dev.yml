volumes:
  minio_data:
    external: false
  postgres_data:
    external: false
  registry_data:
    external: false
  remark42_data:
    external: false
  neo4j_data:
    external: false
  neo4j_logs:
    external: false
  neo4j_import:
    external: false
  neo4j_plugins:
    external: false
  # Claude Code config + chat history (CLAUDE_CONFIG_DIR), shared by root-run dev services
  claude_config:
    external: false
  # Separate volume for scheduler, which runs as the non-root `ubuntu` user
  claude_config_scheduler:
    external: false
  # Antigravity VS Code extension config + chat history (~/.gemini), shared by root-run dev services
  antigravity_config:
    external: false
  # Separate volume for scheduler, which runs as the non-root `ubuntu` user
  antigravity_config_scheduler:
    external: false

services:
  claude-config-init:
    image: busybox:1.36
    command: chown -R 1000:1000 /claude
    volumes:
      - claude_config_scheduler:/claude

  antigravity-config-init:
    image: busybox:1.36
    command: chown -R 1000:1000 /gemini
    volumes:
      - antigravity_config_scheduler:/gemini

  db:
    image: postgres:14
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=accelerator
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accelerator" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
      - "${MINIO_DEV_CERT_LOCATION:?err}:/home/nonroot/.minio/certs"
    command: server /data --console-address ":9001" --certs-dir /home/nonroot/.minio/certs
    env_file:
      - ./.env.minio

  redis:
    image: bitnami/redis:latest
    # command: /opt/bitnami/scripts/redis/run.sh --aof-load-corrupt-tail-max-size 33
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=myredispassword
      - REDIS_MAXMEMORY=1536mb
      - REDIS_MAXMEMORY_POLICY=noeviction
    deploy:
      resources:
        limits:
          memory: 2G

  xet-janitor:
    build:
      context: "${PROJECT_FOLDER:?err}"
      dockerfile: dockerfiles/Dockerfile.devc
    volumes:
      - "${PROJECT_FOLDER:?err}:/app/"
      - claude_config:/claude
      - antigravity_config:/root/.gemini
    env_file:
      - ./.env.web.be
    environment:
      - CLAUDE_CONFIG_DIR=/claude
    stdin_open: true
    command: celery -A xet_janitor.celery_app worker --loglevel=info -Q janitor_queue -B
    tty: true
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  #web_be:
  #  build:
  #    context: "${PROJECT_FOLDER:?err}"
  #    dockerfile: dockerfiles/Dockerfile.be
  #  volumes:
  #    - "${PROJECT_FOLDER:?err}:/app/"
  #  ports:
  #    - 8000:8000
  #    - 20102:20102
  #    - 5173:5173
  #  env_file:
  #    - ./.env.web.be
  #  stdin_open: true
  #  tty: true
  #  depends_on:
  #    db:
  #      condition: service_healthy
  #    minio:
  #      condition: service_started
  #    redis:
  #      condition: service_started
  #    xet-janitor:
  #      condition: service_started

  web_be:
    build:
      context: "${PROJECT_FOLDER:?err}"
      dockerfile: dockerfiles/Dockerfile.devc
    volumes:
      - "${PROJECT_FOLDER:?err}:/app/"
      - ../../xet-core:/app/xet-core
      - ../xet_shard_parser:/app/xet_shard_parser
      - ../../hf-mount:/app/hf-mount
      - ../../gamble-core:/app/gamble-core
      - ../../hf-csi-driver:/app/hf-csi-driver
      - ${ACLI_PROJECT_FOLDER:?err}:/app/accli
      - ${WKUBE_JOB_AGENT_PROJECT_FOLDER:?err}:/app/wkube_job_agent
      - ${WKUBE_JOB_GATEWAY_INTERACTIVE_PROJECT_FOLDER:?err}:/app/wkube_job_gateway_interactive
      - claude_config:/claude
      - antigravity_config:/root/.gemini

    ports:
      - 8000:8000
      - 20102:20102
      - 8081:8081
      - 8080:8080
      - 5173:5173
    env_file:
      - ./.env.web.be
      - ./.env.web.fe
    environment:
      - CLAUDE_CONFIG_DIR=/claude
    stdin_open: true
    tty: true
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
      xet-janitor:
        condition: service_started

  recon:
    build:
      context: "${PROJECT_FOLDER:?err}"
      dockerfile: dockerfiles/Dockerfile.recon.dev
    volumes:
      - "${PROJECT_FOLDER:?err}:/app/"
      - claude_config:/claude
      - antigravity_config:/root/.gemini
    ports:
      - 8900:8900
    env_file:
      - ./.env.web.be
    environment:
      - CLAUDE_CONFIG_DIR=/claude
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  registry:
    image: registry:2
    ports:
      - "5000:5000"
      - "8443:8443"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_HTTP_ADDR: registry:8443
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/server.crt
      REGISTRY_HTTP_TLS_KEY: /certs/server.key
    # Way to generate htpasswd file
    # docker run --rm --entrypoint htpasswd httpd:2 -Bbn myregistry myregistrypassword > services_docker_compose_for_dev/registry_auth/htpasswd
    volumes:
      - registry_data:/var/lib/registry
      - ./registry_auth:/auth
      - ./registry_certs:/certs

  scheduler:
    build:
      context: "${PROJECT_FOLDER:?err}"
      dockerfile: dockerfiles/Dockerfile.scheduler
    # command: sleep infinity
    privileged: true
    env_file:
      - ./.env.web.be
    environment:
      - CLAUDE_CONFIG_DIR=/claude
    volumes:
      - "${PROJECT_FOLDER:?err}:/home/ubuntu/app/"
      - claude_config_scheduler:/claude
      - antigravity_config_scheduler:/home/ubuntu/.gemini
    depends_on:
      claude-config-init:
        condition: service_completed_successfully
      antigravity-config-init:
        condition: service_completed_successfully
      web_be:
        condition: service_started
      redis:
        condition: service_started
      registry:
        condition: service_started

  k8s_events:
    build:
      context: "${PROJECT_FOLDER:?err}"
      dockerfile: dockerfiles/Dockerfile.k8s.events
    env_file:
      - ./.env.web.be
    environment:
      - CLAUDE_CONFIG_DIR=/claude
    volumes:
      - "${PROJECT_FOLDER:?err}:/app/"
      - claude_config:/claude
      - antigravity_config:/root/.gemini
    # volumes:
    #   - "${SCHEDULER_PROJECT_FOLDER:?err}:/app/"
    depends_on:
      web_be:
        condition: service_started

  titiler:
    build:
      context: "${TITILER_FOLDER:?err}"
      dockerfile: Dockerfile.dev
    platform: linux/x86_64
    ports:
      - 8002:8000
    volumes:
      - "${TITILER_FOLDER:?err}:/app/"
      - claude_config:/claude
      - antigravity_config:/root/.gemini
    environment:
      - CLAUDE_CONFIG_DIR=/claude
      - TITILER_API_CORS_ORIGINS=https://localhost:8080,http://localhost:8080,https://accelerator.iiasa.ac.at,https://141-iiasa-forestnavigator.vercel.app

